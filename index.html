<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>李成豪的个人主页</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: '微软雅黑', sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        h1 { color: #2c3e50; font-size: 48px; }
        p { color: #7f8c8d; font-size: 20px; }
        .box {
            background: white; width: 500px; margin: 0 auto;
            padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>你好，我是李成豪！</h1>
        <p>欢迎来到我的 GitHub 个人主页。</p>
        <p>这是我用 Git 和 GitHub 亲手搭建的第一个网站。</p>
    </div>
</body>
</html>
