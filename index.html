<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李成豪 | 个人主页</title>
    <style>
        /* 基础重置与背景 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0d1117; /* GitHub 同款暗色背景 */
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.1), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.1), transparent 25%);
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* 毛玻璃卡片 */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
            z-index: 10;
        }

        /* 头像占位符（你可以换成自己的图片） */
        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* 标题渐变文字 */
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .description {
            font-size: 15px;
            line-height: 1.6;
            color: #c9d1d9;
            margin-bottom: 30px;
        }

        /* 按钮组 */
        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c9d1d9;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            color: white;
        }

        /* 入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">李</div>
        <h1>李成豪</h1>
        <div class="subtitle">Developer & Learner</div>
        
        <p class="description">
            欢迎来到我的数字角落。<br>
            目前正在探索 Web 开发的奇妙世界，记录每一次代码提交与成长轨迹。
        </p>

        <div class="links">
            <!-- 这里的链接改成了你的 GitHub 主页 -->
            <a href="https://github.com/lichenghao-cn" target="_blank" class="btn btn-primary">我的 GitHub</a>
            <!-- 下面可以加个邮箱，把 email 换掉 -->
            <a href="mailto:你的邮箱@qq.com" class="btn">联系我</a>
        </div>
    </div>
</body>
</html>
